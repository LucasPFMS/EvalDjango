<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mes compétences proposées</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'polls/style.css' %}">
</head>
<body>
    <main>
        <h1>Mes compétences proposées</h1>
        <p>Sélectionnez les compétences que vous possédez et êtes prêt à offrir.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Enregistrer</button>
        </form>
        <p><a href="{% url 'home' %}">Retour à l'accueil</a></p>
    </main>
</body>
</html>
