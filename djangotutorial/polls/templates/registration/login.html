<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion</title>
</head>
<body>
    <main>
        <h1>Connexion</h1>
        {% if form.errors %}
            <p>Identifiant ou mot de passe incorrect.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Se connecter</button>
        </form>
    </main>
</body>
</html>
